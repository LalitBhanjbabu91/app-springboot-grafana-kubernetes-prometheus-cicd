# 1. Check out the repository code
- name: Checkout code
  uses: actions/checkout@v4

# 2. Set up JDK 21 environment
- name: Set up JDK 21
  uses: actions/setup-java@v4
  with:
    java-version: '21'
    distribution: 'temurin'
    cache: maven

# 3. Build the JAR file using the Maven Wrapper (ADD THIS STEP)
- name: Build with Maven
  run: chmod +x mvnw && ./mvnw clean package -DskipTests

# 4. Set up Docker Buildx (Your existing step)
- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v3

# 5. Log in to Docker Hub (Your existing step)
- name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

# 6. Build and push Docker image (Your existing step)
- name: Build and push
  uses: docker/build-push-action@v6
  with:
    context: .
    file: ./Dockerfile
    push: true
    tags: |
      lalitkumar91/grafana:0.0.1
      lalitkumar91/grafana:latest
